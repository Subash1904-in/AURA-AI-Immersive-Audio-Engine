[package]
name = "aura"
version = "0.1.0"
description = "AURA AI Immersive Audio Engine"
authors = ["AURA Team"]
edition = "2021"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bench]]
name = "dsp_benchmark"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "isomp4", "alac", "pcm", "aac"] }
cpal = "0.15"
ringbuf = "0.4"
parking_lot = "0.12"
thiserror = "2"
arc-swap = "1.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rustfft = "6.2"
