name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Copy ONNX Runtime DLL (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-win-x64-1.19.2.zip" -OutFile "onnxruntime.zip"
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "onnxruntime_extracted"
          New-Item -ItemType Directory -Force -Path "target/debug/deps"
          New-Item -ItemType Directory -Force -Path "target/debug"
          Get-ChildItem -Path "onnxruntime_extracted" -Filter "onnxruntime.dll" -Recurse | ForEach-Object {
              Copy-Item $_.FullName -Destination "target/debug/deps/" -Force
              Copy-Item $_.FullName -Destination "target/debug/" -Force
              Write-Host "Successfully copied $($_.FullName) to target directories"
          }

      - name: Run Cargo tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Run Criterion DSP Benchmarks
        working-directory: src-tauri
        run: cargo bench --bench dsp_benchmark

      - name: Run Criterion Convolution Benchmarks
        working-directory: src-tauri
        run: cargo bench --bench convolution_benchmark

      - name: Upload Criterion Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: dsp-criterion-benchmark-${{ matrix.os }}
          path: src-tauri/target/criterion
          if-no-files-found: ignore

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri debug binary
        run: npx tauri build --debug --no-bundle
